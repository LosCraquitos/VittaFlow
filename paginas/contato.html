<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Entre em contato com a equipe do VittaFlow. Envie dúvidas, sugestões ou mensagens.">
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/contato.css">
    <link rel="icon" type="image/x-icon" href="../assets/icons/logo.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <title>Contato | VittaFlow</title>
</head>

<body>
    <header>
        <div class="logo">
            <a href="../index.html"><img src="../assets/icons/logo.png" alt="Logo VittaFlow" class="logoImg"></a>
            <span>Vitta<p>Flow</p></span>
        </div>

        <button class="btn-menu" id="btn-menu" aria-label="Abrir menu" aria-expanded="false"
            aria-controls="menu-centro">
            <span></span>
            <span></span>
            <span></span>
        </button>

        <nav class="menu-centro" id="menu-centro">
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./integrantes.html">Integrantes</a></li>
                <li><a href="./sobre.html">Sobre</a></li>
                <li><a href="./faq.html">FAQ</a></li>
                <li><a href="./contato.html" class="ativo">Contato</a></li>
                <li><a href="./vagas.html">Vagas</a></li>
                <li><a href="./vacinas.html">Vacinas</a></li>
                <li class="menu-login"><a href="login.html" class="btn">Entrar</a></li>
            </ul>
        </nav>

        <div class="botoes-direita">
            <a href="login.html" class="btn">Entrar</a>
        </div>
    </header>

    <main>
        <section class="secao-contato">
            <form class="form-contato" action="">
                <h2>Entre em contato</h2>
                <p>Envie sua mensagem para o VittaFlow.</p>

                <label for="nome">
                    Nome
                    <input type="text" id="nome" name="nome" placeholder="Seu nome completo" required>
                </label>

                <label for="email">
                    E-mail
                    <input type="email" id="email" name="email" placeholder="seuemail@exemplo.com" required>
                </label>

                <label for="assunto">
                    Assunto
                    <input type="text" id="assunto" name="assunto" placeholder="Assunto da mensagem" required>
                </label>

                <label for="mensagem">
                    Mensagem
                    <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" required></textarea>
                </label>

                <button type="submit" class="btn" o>Enviar</button>
            </form>
        </section>
    </main>

    <footer>
        <p>© 2026 VittaFlow | FIAP</p>
    </footer>

    <script src="../js/script.js"></script>
    <script src="../js/contato.js"></script>
</body>

</html>
